name: Compatibility regression
description: CCO behaves incorrectly against a specific Claude Code version.
labels: ["compatibility"]
body:
  - type: input
    id: claude-version
    attributes: { label: Claude Code version }
    validations: { required: true }
  - type: input
    id: cco-version
    attributes: { label: CCO version }
    validations: { required: true }
  - type: textarea
    id: doctor-output
    attributes:
      label: Redacted `cco doctor --json` output
      description: Remove any paths/identifiers you consider sensitive before pasting.
    validations: { required: true }
  - type: textarea
    id: expected-actual
    attributes: { label: Expected vs. actual behavior }
    validations: { required: true }
