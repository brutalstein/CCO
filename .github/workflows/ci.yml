name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run build:plugin
      - run: npm run package:release
      - run: npm run verify:release
      - name: verify fake-claude fixture repo fingerprint
        run: node --input-type=module -e "import { DefaultRepoAnalyzer } from './packages/core/dist/index.js'; import { NodeProcessLauncher } from './packages/platform/dist/index.js'; const fp = await new DefaultRepoAnalyzer(new NodeProcessLauncher()).fingerprint('./fixtures/repositories/typescript-react'); if (!fp.frameworks.includes('react')) throw new Error('fixture regression'); console.log('ok');"

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - run: npm ci
      - run: npm run build
      - run: node scripts/generate-schemas.mjs
      - run: git diff --exit-code schemas/
